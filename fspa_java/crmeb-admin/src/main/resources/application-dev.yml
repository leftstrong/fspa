# CRMEB 相关配置
crmeb:
  version: CRMEB-JAVA-KY-v1.3.4 # 当前代码版本
  domain: #配合swagger使用 # 待部署域名
  wechat-api-url:  #请求微信接口中专服务器
  wechat-js-api-debug: false #微信js api系列是否开启调试模式
  wechat-js-api-beta: true #微信js api是否是beta版本
  asyncConfig: false #是否同步config表数据到redis
  asyncWeChatProgramTempList: false #是否同步小程序公共模板库
#  imagePath: /www/wwwroot/Crmeb-admin.jar path/ # 服务器图片路径配置 斜杠结尾
  imagePath: D:\java-project\crmeb\crmebimage\ # 服务器图片路径配置 斜杠结尾

server:
  port: 20010

spring:
  profiles:
    #  配置的环境
    active: dev
    #  数据库配置
  servlet:
    multipart:
      max-file-size: 50MB #设置单个文件大小
      max-request-size: 50MB #设置单次请求文件的总大小
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.0.186:3306/crmeb?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  redis:
    # Redis 真实地址（与后台/管理端一致）：192.168.0.154:16379，密码 1234567
    host: 192.168.0.154 #地址
    port: 16379 #端口
    password: 1234567
    timeout: 10000 # 连接超时时间（毫秒） 【RedisConfig 通过 @Value 注入，不可省略】
    database: 0 #默认数据库
    jedis:
      pool:
        max-active: 8 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1 # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 8 # 连接池中的最大空闲连接
        min-idle: 2 # 连接池中的最小空闲连接（保持热连接，避免池空时新建失败）
        time-between-eviction-runs: 30000 # 逐出扫描间隔 30s：清理失效空闲连接
        test-while-idle: true # 空闲连接有效性探测
        test-on-borrow: true # 取出连接前校验（防 phpstudy Redis 瞬断后拿到死连接）
        test-on-return: true # 归还连接前校验
    # 注意：本项目的 RedisConfig 显式使用 Jedis 客户端（JedisConnectionFactory），
    #       spring.redis.lettuce.* 不会生效，此处仅按原配置原样保留备查。
    lettuce:
      pool:
        max-active: 8   #最大连接数据库连接数,设 -1 为没有限制
        max-idle: 8     #最大等待连接中的数量,设 0 为没有限制
        max-wait: -1ms  #最大建立连接等待时间。如果超过此时间将接到异常。设为-1表示无限制。
        min-idle: 0     #最小等待连接中的数量,设 0 为没有限制
      shutdown-timeout: 100ms
#swagger 配置
swagger:
  basic:
    enable: true #是否开启
    check: false #是否打开验证
    username: #访问swagger的账号
    password: #访问swagger的密码
# mybatis 配置
mybatis-plus:
  # 配置slq打印日志
  configuration:
#    logImpl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    logImpl: org.apache.ibatis.logging.stdout.StdOutImpl
#阿里云
aliyun:
  AccessKey: ${ALIYUN_ACCESSKEY:}
  AccessKeySecret: ${ALIYUN_ACCESSKEYSECRET:}
  Region: cn-shenzhen
  Version: '2017-05-25'
  SignName: Fspa头皮立体抗衰中心
  Domain: dysmsapi.aliyuncs.com
