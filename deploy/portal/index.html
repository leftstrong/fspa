<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>良物换物 · 服务入口</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff5a36'/%3E%3Cpath d='M10 13h12l-3-3M22 19H10l3 3' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --cream: #fff9f2;
    --coral: #ff5a36;
    --coral-text: #c3350e;
    --green: #00b98a;
    --green-text: #007a5b;
    --forest: #235f4e;
    --amber: #ffc43d;
    --text: #1a1614;
    --muted: #6b5f57;
    --line: rgba(26, 22, 20, 0.1);
    --font-cn: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: clamp(32px, 6vw, 88px) clamp(20px, 5vw, 56px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: var(--font-cn);
    color: var(--text);
    background:
      radial-gradient(70% 55% at 12% 4%, rgba(255, 196, 61, 0.16), rgba(255, 255, 255, 0) 62%),
      radial-gradient(62% 52% at 92% 10%, rgba(0, 185, 138, 0.14), rgba(255, 255, 255, 0) 64%),
      radial-gradient(90% 70% at 50% 108%, rgba(255, 90, 54, 0.12), rgba(255, 255, 255, 0) 70%),
      var(--cream);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; }

  /* ---------- 顶部品牌 ---------- */
  .brand { display: flex; align-items: center; gap: 12px; }

  .brand__mark {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #ff8f3d, var(--coral) 62%, #e8431c);
    box-shadow: 0 8px 20px -8px rgba(232, 67, 28, 0.6);
  }

  .brand__mark svg { width: 21px; height: 21px; }

  .brand__name { font-size: 16.5px; font-weight: 700; letter-spacing: 0.02em; }

  .brand__tag {
    margin-left: 2px; padding: 3px 8px; border-radius: 6px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--coral-text); background: rgba(255, 90, 54, 0.1);
  }

  /* ---------- 标题 ---------- */
  .head { margin: clamp(38px, 5vw, 60px) 0 clamp(26px, 3.4vw, 38px); }

  .head h1 {
    margin: 0;
    font-size: clamp(25px, 3.2vw, 34px);
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.3;
  }

  .head p {
    margin: 12px 0 0;
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--muted);
    max-width: 54ch;
  }

  /* ---------- 卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(14px, 1.8vw, 22px);
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 26px 24px 22px;
    border-radius: 18px;
    text-decoration: none;
    color: inherit;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(26, 22, 20, 0.04), 0 14px 34px -26px rgba(26, 22, 20, 0.28);
    backdrop-filter: blur(6px);
    overflow: hidden;
    transition: transform 0.55s var(--ease), box-shadow 0.55s var(--ease), border-color 0.4s var(--ease);
  }

  /* 卡片顶部的品牌色细条 */
  .card::before {
    content: "";
    position: absolute; top: 0; left: 0; height: 3px;
    width: 46px;
    background: var(--tint);
    border-radius: 0 3px 3px 0;
    transition: width 0.6s var(--ease);
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(26, 22, 20, 0.16);
    box-shadow: 0 2px 3px rgba(26, 22, 20, 0.05), 0 26px 50px -30px rgba(26, 22, 20, 0.36);
  }

  .card:hover::before { width: 100%; border-radius: 0; }

  .card:focus-visible {
    outline: 2px solid var(--tint);
    outline-offset: 3px;
  }

  .card__icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--tint-soft);
    color: var(--tint-deep);
    margin-bottom: 18px;
  }

  .card__icon svg { width: 22px; height: 22px; }

  .card__name {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.005em;
  }

  .card__desc {
    margin: 8px 0 0;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--muted);
    flex: 1;
  }

  .card__foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px dashed rgba(26, 22, 20, 0.11);
  }

  .card__path {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    color: var(--tint-deep);
    letter-spacing: 0.01em;
  }

  .card__go {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 600;
    color: var(--muted);
    transition: color 0.35s var(--ease), gap 0.35s var(--ease);
  }

  .card:hover .card__go { color: var(--tint-deep); gap: 9px; }

  /* ---------- 底部 ---------- */
  .foot {
    margin-top: clamp(30px, 4vw, 46px);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
    font-size: 12.5px;
    color: var(--muted);
  }

  .foot code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(26, 22, 20, 0.055);
    color: var(--text);
  }

  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(0, 185, 138, 0.16);
  }

  .status { display: inline-flex; align-items: center; gap: 8px; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .card { padding: 22px 20px 18px; }
    .card__icon { margin-bottom: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h13l-3.2-3.2"/>
        <path d="M20 15H7l3.2 3.2"/>
      </svg>
    </span>
    <span class="brand__name">良物换物</span>
    <span class="brand__tag">服务入口</span>
  </div>

  <div class="head">
    <h1>选择要进入的工程</h1>
    <p>三个站点部署在同一台服务器、同一个端口下，按路径区分。点击卡片即可进入，接口都走当前域名的同源请求。</p>
  </div>

  <div class="grid">

    <a class="card" href="/web/" style="--tint:#ff5a36; --tint-deep:#c3350e; --tint-soft:rgba(255,90,54,.1)">
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.6" y="4" width="18.8" height="15.4" rx="2.6"/>
          <path d="M2.6 8.6h18.8"/>
          <circle cx="5.9" cy="6.3" r=".9" fill="currentColor" stroke="none"/>
          <circle cx="8.6" cy="6.3" r=".9" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <h2 class="card__name">品牌官网</h2>
      <p class="card__desc">换物闭环、信用体系与品牌故事</p>
      <div class="card__foot">
        <span class="card__path">/web/</span>
        <span class="card__go">进入
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>

    <a class="card" href="/h5/" style="--tint:#00b98a; --tint-deep:#007a5b; --tint-soft:rgba(0,185,138,.11)">
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6.2" y="2.4" width="11.6" height="19.2" rx="2.8"/>
          <path d="M10.6 5.2h2.8"/>
          <path d="M10.4 18.8h3.2"/>
        </svg>
      </span>
      <h2 class="card__name">用户端 H5</h2>
      <p class="card__desc">浏览、发布、议价与链路追踪</p>
      <div class="card__foot">
        <span class="card__path">/h5/</span>
        <span class="card__go">进入
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>

    <a class="card" href="/admin/" style="--tint:#235f4e; --tint-deep:#1a4a3c; --tint-soft:rgba(35,95,78,.1)">
      <span class="card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.8l7.4 3v6.1c0 4.4-3 7.6-7.4 9.3-4.4-1.7-7.4-4.9-7.4-9.3V5.8z"/>
          <path d="M8.9 12.1l2.2 2.2 4-4.3"/>
        </svg>
      </span>
      <h2 class="card__name">运营管理后台</h2>
      <p class="card__desc">商品、订单、举报与链路治理</p>
      <div class="card__foot">
        <span class="card__path">/admin/</span>
        <span class="card__go">进入
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>

  </div>

  <div class="foot">
    <span class="status"><span class="dot" aria-hidden="true"></span>服务运行中</span>
    <span>健康检查 <code>/healthz</code></span>
    <span>接口 <code>/api/front</code> · <code>/api/admin</code></span>
  </div>

</div>
</body>
</html>
