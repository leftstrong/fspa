# 三套站点共用的接口反代。
# 后端真实路径就是 /api/front/** 和 /api/admin/**，所以 proxy_pass 不带 URI，
# 原样转发前缀，不要写成 http://api_front/（那样会把前缀截掉导致 404）。
#
# 全部用 ^~ 前缀匹配：否则 /crmebimage/xxx.jpg 会先命中 snippets/static.conf 的
# 静态资源正则，被 try_files 判成 404，上传的图片就全挂了。

location ^~ /api/front/ {
    proxy_pass         http://api_front;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
}

location ^~ /api/admin/ {
    proxy_pass         http://api_admin;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
}

# 用户上传的图片：后端把 imagePath 映射成 /crmebimage/** 与 /image/**
location ^~ /crmebimage/ {
    proxy_pass         http://api_front;
    proxy_http_version 1.1;
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Connection      "";
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location ^~ /image/ {
    proxy_pass         http://api_front;
    proxy_http_version 1.1;
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Connection      "";
}
