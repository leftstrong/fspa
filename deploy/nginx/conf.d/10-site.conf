# ---------------------------------------------------------------------------
# 单端口入口（对外只开 13999）
#
#   /        入口导航页（选择进入哪个工程）
#   /web/    品牌官网      fspa_web
#   /h5/     用户端 H5     fspa_uni 构建产物
#   /admin/  运营管理后台  fspa_vue 构建产物
#
# 三个站点的静态资源都在各自的子目录下（/web/assets、/h5/static、/admin/static），
# 不会互相覆盖。接口全部同源：/api/front、/api/admin。
# ---------------------------------------------------------------------------
server {
    listen      80 default_server;
    server_name _;

    # 刻意把 root 设成站点根目录而不是 portal 目录，
    # 这样下面的静态资源正则（root 相同）能同时匹配 /web /h5 /admin 下的文件
    root  /usr/share/nginx;
    index index.html;

    # html 不缓存，带 hash 的静态资源由 snippets/static.conf 覆盖成长缓存
    add_header Cache-Control "no-store";

    # ---------- 入口页 ----------
    # 用内部转发而不是 302，地址栏保持在 / ，不会跳到 /portal/
    location = / {
        rewrite ^ /portal/index.html last;
    }

    location ^~ /portal/ {
        try_files $uri $uri/ =404;
    }

    # ---------- 官网 ----------
    # 页面是纯静态相对路径，$uri.html 兜底支持 /web/features 这种省略后缀的访问
    location ^~ /web/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---------- H5 商城 ----------
    # uni-app 用 history 路由（base=/h5/），未命中的路径回落到 /h5/index.html
    location ^~ /h5/ {
        try_files $uri $uri/ /h5/index.html;
    }

    # ---------- 管理后台 ----------
    # vue-router history 模式（base=/admin/），同样回落
    # 安全建议：这是敏感入口，生产环境建议加 IP 白名单
    #   location ^~ /admin/ { allow 1.2.3.4; deny all; try_files ...; }
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    include /etc/nginx/snippets/static.conf;
    include /etc/nginx/snippets/api.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
